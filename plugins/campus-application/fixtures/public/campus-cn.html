<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>秋招网申结构化简历 Fixture</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><h1>2027 届校园招聘 — 本地网申 Fixture</h1><div class="note">用于 WebCodex Browser Use / Campus Application Plugin dogfood，所有字段均为本地模拟。</div><form><div class="grid"><div class="full"><label for="name">姓名</label><input id="name"></div><div><label for="phone">手机号</label><input id="phone" type="tel"></div><div><label for="email">邮箱</label><input id="email" type="email"></div><div><label for="city">所在城市</label><input id="city"></div><div><label for="school">学校</label><input id="school"></div><div><label for="degree">学历</label><select id="degree"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div><div><label for="major">专业</label><input id="major"></div><div><label for="graduation">预计毕业时间</label><input id="graduation" type="month"></div><div><label for="gpa">GPA / 绩点</label><input id="gpa"></div><div class="full"><label for="github">GitHub</label><input id="github" type="url"></div><div class="full"><label for="portfolio">个人主页</label><input id="portfolio" type="url"></div><div class="full"><label for="intro">自我介绍</label><textarea id="intro"></textarea></div><div class="full"><label for="resume">上传简历</label><input id="resume" type="file"></div></div><section class="section"><fieldset><legend>是否接受岗位调剂</legend><div class="row"><label><input type="radio" name="transfer" value="yes" style="width:auto"> 是</label><label><input type="radio" name="transfer" value="no" style="width:auto"> 否</label></div></fieldset></section><div class="actions"><button type="submit">保存并进入下一步</button><button type="button" class="secondary">暂存</button></div><div id="status" class="status">尚未保存。</div></form></main><script src="/fixture.js"></script></body></html>
