name: Manual release build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit to build
        required: true
        default: xiaofei
        type: string
      amd64:
        description: Build Linux amd64
        required: false
        default: true
        type: boolean
      arm64:
        description: Build Linux arm64
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.arches.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_ref }}

      - name: Capture source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate architecture selection
        id: arches
        shell: bash
        env:
          AMD64: ${{ inputs.amd64 }}
          ARM64: ${{ inputs.arm64 }}
        run: |
          set -euo pipefail
          arches=()
          [[ "$AMD64" == "true" ]] && arches+=(amd64)
          [[ "$ARM64" == "true" ]] && arches+=(arm64)
          if [ "${#arches[@]}" -eq 0 ]; then
            echo "Select at least one architecture (amd64 and/or arm64)." >&2
            exit 1
          fi
          printf 'Selected architectures: %s\n' "${arches[*]}"
          matrix=()
          [[ "$AMD64" == "true" ]] && matrix+=('{"arch":"amd64","runner":"ubuntu-latest","image":"quay.io/pypa/manylinux2014_x86_64","machine":"x86_64","elf_machine":"Advanced Micro Devices X86-64"}')
          [[ "$ARM64" == "true" ]] && matrix+=('{"arch":"arm64","runner":"ubuntu-24.04-arm","image":"quay.io/pypa/manylinux2014_aarch64","machine":"aarch64","elf_machine":"AArch64"}')
          printf 'matrix=[%s]\n' "$(IFS=,; echo "${matrix[*]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: '${{ fromJSON(needs.prepare.outputs.matrix) }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      MANYLINUX_IMAGE: ${{ matrix.image }}
      CARGO_CACHE_DIR: /tmp/webcodex-manual-cargo-${{ matrix.arch }}
      RUSTUP_CACHE_DIR: /tmp/webcodex-manual-rustup-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_CACHE_DIR }}
            ${{ env.RUSTUP_CACHE_DIR }}
            target
          key: manual-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: |
            manual-${{ matrix.arch }}-

      - name: Build inside glibc 2.17 userspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_CACHE_DIR" "$RUSTUP_CACHE_DIR" dist

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$CARGO_CACHE_DIR:/cargo" \
            -v "$RUSTUP_CACHE_DIR:/rustup" \
            -w /work \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e SOURCE_SHA \
            "$MANYLINUX_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH="/cargo/bin:$PATH"
              git config --global --add safe.directory /work

              if [ "$(uname -m)" != "${{ matrix.machine }}" ]; then
                echo "Unexpected native architecture: $(uname -m)" >&2
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
                echo "Build checkout does not match prepared source commit." >&2
                exit 1
              fi
              if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                echo "Build checkout is not clean before compilation." >&2
                exit 1
              fi

              if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
                yum install -y git curl
              fi
              if [ ! -x /cargo/bin/rustup ]; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable
              fi
              rustup toolchain install stable --profile minimal
              rustup default stable
              rustc --version --verbose
              cargo --version --verbose

              cargo build --locked --release -p webcodex -p webcodex-cli -p webcodex-runner

              mkdir -p dist/webcodex-${{ matrix.arch }}
              cp target/release/webcodex dist/webcodex-${{ matrix.arch }}/
              cp target/release/webcodex-server dist/webcodex-${{ matrix.arch }}/
              cp target/release/webcodex-runner dist/webcodex-${{ matrix.arch }}/

              for name in webcodex webcodex-server webcodex-runner; do
                binary="target/release/$name"
                if ! readelf -h "$binary" | grep -F "Machine:" | grep -Fq "${{ matrix.elf_machine }}"; then
                  echo "Unexpected ELF architecture for $binary" >&2
                  readelf -h "$binary" >&2
                  exit 1
                fi

                max_glibc="$(readelf --version-info "$binary" \
                  | grep -oE "GLIBC_[0-9]+(\\.[0-9]+)*" \
                  | sed "s/^GLIBC_//" \
                  | sort -Vu \
                  | tail -n 1 || true)"
                if [ -n "$max_glibc" ] && [ "$(printf "%s\\n" 2.17 "$max_glibc" | sort -V | tail -n 1)" != "2.17" ]; then
                  echo "$binary requires GLIBC_$max_glibc, exceeding the 2.17 release floor." >&2
                  exit 1
                fi
              done

              tar -C "dist/webcodex-${{ matrix.arch }}" \
                -czf "dist/webcodex-${{ matrix.arch }}.tar.gz" \
                webcodex webcodex-server webcodex-runner
            '

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/webcodex-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release archives were produced." >&2
            exit 1
          fi

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create latest \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "Manual build from ${SOURCE_SHA}" \
            --latest \
            --target "$SOURCE_SHA"
