name: Manual release build

on:
  workflow_dispatch:
    inputs:
      amd64:
        description: Build Linux amd64
        required: false
        default: true
        type: boolean
      arm64:
        description: Build Linux arm64
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.arches.outputs.arches }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Capture source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate architecture selection
        id: arches
        shell: bash
        env:
          AMD64: ${{ inputs.amd64 }}
          ARM64: ${{ inputs.arm64 }}
        run: |
          set -euo pipefail
          arches=()
          [[ "$AMD64" == "true" ]] && arches+=(amd64)
          [[ "$ARM64" == "true" ]] && arches+=(arm64)
          if [ "${#arches[@]}" -eq 0 ]; then
            echo "Select at least one architecture (amd64 and/or arm64)." >&2
            exit 1
          fi
          printf 'Selected architectures: %s\n' "${arches[*]}"
          printf 'arches=[%s]\n' "$(printf '"%s",' "${arches[@]}" | sed 's/,$//')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Validate source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = amd64 ]; then
            target=x86_64-unknown-linux-gnu
          else
            target=aarch64-unknown-linux-gnu
          fi
          rustup target add "$target"
          cargo build --release --target "$target" -p webcodex-cli --bin webcodex
          cargo build --release --target "$target" -p webcodex --bin webcodex-server
          cargo build --release --target "$target" -p webcodex-runner
          mkdir -p dist
          staging="dist/webcodex-${{ matrix.arch }}"
          mkdir -p "$staging"
          cp "target/$target/release/webcodex" "$staging/"
          cp "target/$target/release/webcodex-server" "$staging/"
          cp "target/$target/release/webcodex-runner" "$staging/"
          tar -C "$staging" -czf "dist/webcodex-${{ matrix.arch }}.tar.gz" webcodex webcodex-server webcodex-runner

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/webcodex-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release archives were produced." >&2
            exit 1
          fi

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create latest \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "Manual build from main @ ${SOURCE_SHA}" \
            --latest \
            --target "$SOURCE_SHA"
